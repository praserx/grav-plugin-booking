      CAPACITY_HELP: Maximum number of simultaneous bookings (0 = unlimited)
      WORKING_HOURS_START: Working Hours Start
      WORKING_HOURS_START_HELP: Daily start time (HH:MM format)
      WORKING_HOURS_END: Working Hours End
      WORKING_HOURS_END_HELP: Daily end time (HH:MM format)
      BOOKING_HORIZON: Booking Horizon (days)
      BOOKING_HORIZON_HELP: How far in advance bookings can be made
      MIN_ADVANCE_NOTICE: Minimum Advance Notice (hours)
      MIN_ADVANCE_NOTICE_HELP: Minimum hours before a booking can start
      PENDING_BLOCKS_AVAILABILITY: Pending Bookings Block Availability
      PENDING_BLOCKS_AVAILABILITY_HELP: When enabled, pending bookings reserve slots
    
