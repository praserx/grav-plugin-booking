en:
  PLUGIN_BOOKING:
    # Plugin metadata
    NAME: Booking
    DESCRIPTION: Facility and room booking plugin for Grav 2
    
    # Configuration labels
    CONFIG:
      SECTION_GENERAL: General Settings
      SECTION_FACILITIES: Facilities
      SECTION_BOOKING_RULES: Booking Rules
      SECTION_NOTIFICATIONS: Notifications
      
      ENABLED: Plugin Enabled
      ENABLED_HELP: Enable or disable the booking plugin
      
      FACILITY_NAME: Facility Name
      FACILITY_NAME_HELP: Display name for this facility
      FACILITY_SLUG: Facility Slug
      FACILITY_SLUG_HELP: Unique identifier for this facility (used in URLs)
      FACILITY_TIMEZONE: Timezone
      FACILITY_TIMEZONE_HELP: IANA timezone for this facility (e.g., Europe/Prague)
      FACILITY_MODE: Booking Mode
      FACILITY_MODE_HELP: How this facility can be booked
      FACILITY_MODE_FACILITY: Whole facility only
      FACILITY_MODE_RESOURCES: Individual resources only
      FACILITY_MODE_BOTH: Both facility and resources
