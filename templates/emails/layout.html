<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ email.subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f7;font-family:Arial,Helvetica,sans-serif;color:#20242a;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {{ email.subject }}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f2f4f7;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e1e5ea;border-radius:12px;border-collapse:separate;">
          <tr>
            <td style="padding:24px 32px;background-color:#242832;border-radius:12px 12px 0 0;color:#ffffff;font-size:18px;font-weight:bold;">
              {{ facility.name }}
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 12px;font-size:22px;line-height:1.35;font-weight:bold;color:#20242a;">
              {{ email.subject }}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 28px;font-size:15px;line-height:1.65;color:#343a40;">
              {{ email.body }}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e1e5ea;color:#68707b;font-size:12px;line-height:1.5;">
              Booking reference: {{ booking.id }}<br>
              {{ facility.name }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
